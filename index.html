<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --sky:    #00C2FF;
  --sky2:   #0088DD;
  --green:  #00FF87;
  --green2: #00C96A;
  --amber:  #FFB800;
  --red:    #FF3333;
  --dark:   #050810;
  --panel:  #0C1018;
  --panel2: #101520;
  --dim:    rgba(255,255,255,0.38);
  --white:  #FFFFFF;
}

html{scroll-behavior:smooth;}
body{
  font-family:'Rajdhani',sans-serif;
  background:var(--dark);
  color:var(--white);
  min-height:100vh;
  overflow-x:hidden;
}

canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* grain */
.grain{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.028;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px 256px;
}

/* cricket pitch lines bg */
.pitch-lines{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,194,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,194,255,0.03) 1px, transparent 1px);
  background-size:60px 60px;
}

.page{
  position:relative;z-index:1;
  max-width:460px;margin:0 auto;
  padding-bottom:80px;
}

/* ═══════════ STICKY TOP BAR ═══════════ */
.sticky{
  position:sticky;top:0;z-index:100;
  background:rgba(5,8,16,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,194,255,0.12);
  padding:9px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.sticky-left{display:flex;align-items:center;gap:9px;min-width:0;}
.sticky-live{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,51,51,0.12);
  border:1px solid rgba(255,51,51,0.3);
  border-radius:4px;padding:3px 9px;
  flex-shrink:0;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--red);box-shadow:0 0 7px var(--red);
  animation:blink 1s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.1}}
.live-txt{font-size:8px;font-weight:700;letter-spacing:3px;color:var(--red);text-transform:uppercase;}
.sticky-name{
  font-family:'Black Ops One',cursive;
  font-size:15px;letter-spacing:1px;color:var(--white);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sticky-btn{
  font-family:'Rajdhani',sans-serif;
  font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:#fff;border:none;border-radius:6px;cursor:pointer;
  padding:9px 16px;white-space:nowrap;flex-shrink:0;
  background:linear-gradient(135deg,var(--sky2),var(--sky));
  box-shadow:0 0 16px rgba(0,194,255,0.4);
  transition:transform 0.15s,box-shadow 0.15s;
  animation:stickyPulse 2.5s ease-in-out infinite;
}
.sticky-btn:hover{transform:scale(1.05);}
.sticky-btn:active{transform:scale(0.97);}
@keyframes stickyPulse{0%,100%{box-shadow:0 0 16px rgba(0,194,255,0.4);}50%{box-shadow:0 0 28px rgba(0,194,255,0.7);}}

/* ═══════════ HERO ═══════════ */
.hero{
  position:relative;
  padding:36px 24px 0;
  text-align:center;
  overflow:hidden;
}

/* Background aura */
.hero-aura{
  position:absolute;
  width:420px;height:300px;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,194,255,0.12) 0%,transparent 70%);
  top:-40px;left:50%;transform:translateX(-50%);
  pointer-events:none;
  animation:auraBreath 6s ease-in-out infinite;
}
@keyframes auraBreath{0%,100%{opacity:0.7;transform:translateX(-50%) scale(1);}50%{opacity:1;transform:translateX(-50%) scale(1.1);}}

/* ── LOGO FRAME ── */
.logo-frame{
  position:relative;
  width:138px;height:138px;
  margin:0 auto;
  opacity:0;animation:up 0.8s 0.1s ease forwards;
}

/* Outer glow ring */
.logo-frame::before{
  content:'';position:absolute;
  inset:-10px;border-radius:50%;
  background:conic-gradient(
    var(--sky) 0deg,
    var(--green) 90deg,
    var(--amber) 180deg,
    var(--sky) 360deg
  );
  animation:spinRing 5s linear infinite;
  filter:blur(1px);
}
.logo-frame::after{
  content:'';position:absolute;
  inset:-3px;border-radius:50%;
  background:conic-gradient(
    var(--sky),var(--green),var(--amber),var(--sky)
  );
  animation:spinRing 5s linear infinite;
}
@keyframes spinRing{to{transform:rotate(360deg);}}

.logo-bg{
  position:absolute;inset:4px;
  border-radius:50%;
  background:var(--panel);
  z-index:1;
}

/* Logo image — replace src with your image URL */
.logo-img{
  position:absolute;inset:6px;
  width:calc(100% - 12px);height:calc(100% - 12px);
  border-radius:50%;
  object-fit:cover;
  z-index:2;
  /* Default placeholder styling if no image */
  background:linear-gradient(135deg,var(--panel2),#1a2030);
  display:flex;align-items:center;justify-content:center;
}

/* Placeholder icon when no logo set */
.logo-placeholder{
  position:absolute;inset:6px;
  border-radius:50%;
  z-index:2;
  background:linear-gradient(135deg,#0d1520,#1a2535);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;
}
.logo-placeholder .lp-icon{font-size:38px;}
.logo-placeholder .lp-text{
  font-size:8px;font-weight:700;letter-spacing:2px;
  color:rgba(255,255,255,0.25);text-transform:uppercase;
}

.logo-glow-base{
  position:absolute;
  bottom:-16px;left:50%;transform:translateX(-50%);
  width:120px;height:28px;
  background:radial-gradient(ellipse,rgba(0,194,255,0.4) 0%,transparent 70%);
  filter:blur(8px);
}



/* ── NAME ── */
.hero-name{
  font-family:'Black Ops One',cursive;
  font-size:clamp(30px,9vw,46px);
  letter-spacing:3px;line-height:1;
  color:transparent;
  background:linear-gradient(160deg,#FFFFFF 0%,#A8E4FF 30%,#00C2FF 55%,#A8E4FF 80%,#FFFFFF 100%);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  animation:nameShine 4s linear infinite, up 0.9s 0.25s ease both;
  opacity:0;margin-top:20px;
  filter:drop-shadow(0 0 24px rgba(0,194,255,0.4));
}
@keyframes nameShine{to{background-position:200% center;}}

.hero-sub{
  font-size:11px;font-weight:600;letter-spacing:4px;
  color:var(--dim);text-transform:uppercase;
  margin-top:7px;
  opacity:0;animation:up 0.7s 0.32s ease forwards;
}

.hero-icons{
  font-size:22px;letter-spacing:5px;
  margin-top:10px;
  opacity:0;animation:up 0.7s 0.38s ease forwards;
}

/* Members */
.members-row{
  display:inline-flex;align-items:center;gap:12px;
  background:rgba(0,194,255,0.06);
  border:1px solid rgba(0,194,255,0.15);
  border-radius:50px;padding:9px 22px;
  margin-top:16px;
  opacity:0;animation:up 0.7s 0.44s ease forwards;
}
.m-num{
  font-family:'Black Ops One',cursive;
  font-size:22px;letter-spacing:1px;
  color:var(--green);
  filter:drop-shadow(0 0 10px rgba(0,255,135,0.5));
  animation:numGlow 2.5s ease-in-out infinite;
}
@keyframes numGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(0,255,135,0.4));}50%{filter:drop-shadow(0 0 20px rgba(0,255,135,0.8));}}
.m-div{width:1px;height:26px;background:rgba(255,255,255,0.1);}
.m-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;line-height:1.5;}
.m-lbl b{color:#fff;display:block;font-size:12px;}

/* ═══════════ MAIN CTA ═══════════ */
.main-cta{
  padding:22px 20px 0;
  opacity:0;animation:up 0.7s 0.5s ease forwards;
}

/* Urgency */
.urgency{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:14px;
}
.urg-txt{
  font-size:12px;font-weight:700;letter-spacing:0.5px;
  color:var(--amber);
  animation:urgFlash 2s infinite;
}
@keyframes urgFlash{0%,100%{opacity:1}50%{opacity:0.4}}

/* BIG BUTTON */
.big-wrap{position:relative;}
.big-halo{
  position:absolute;inset:-10px;border-radius:20px;
  background:linear-gradient(105deg,rgba(0,194,255,0.35),rgba(0,136,221,0.25));
  filter:blur(22px);
  animation:haloBreath 2.5s ease-in-out infinite;
}
@keyframes haloBreath{0%,100%{opacity:0.5;transform:scale(0.97);}50%{opacity:1;transform:scale(1.02);}}

.big-btn{
  position:relative;width:100%;
  padding:22px 20px;
  font-family:'Black Ops One',cursive;
  font-size:22px;letter-spacing:3px;text-transform:uppercase;
  color:#fff;border:none;border-radius:16px;cursor:pointer;
  background:linear-gradient(105deg,#0055AA 0%,#0099EE 35%,#00C2FF 55%,#0099EE 75%,#0055AA 100%);
  background-size:250% auto;
  animation:btnShine 3s linear infinite;
  transition:transform 0.15s,box-shadow 0.15s;
  box-shadow:0 6px 50px rgba(0,150,220,0.5),0 1px 0 rgba(255,255,255,0.12) inset;
  display:flex;align-items:center;justify-content:center;gap:14px;
  overflow:hidden;
}
.big-btn:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 10px 65px rgba(0,150,220,0.7);}
.big-btn:active{transform:scale(0.98);}
.big-btn::after{
  content:'';position:absolute;
  top:-50%;left:-80%;width:45%;height:200%;
  background:rgba(255,255,255,0.18);transform:skewX(-18deg);
  animation:swipe 3.5s 0.8s infinite;
}
@keyframes swipe{0%{left:-80%;}55%,100%{left:130%;}}
@keyframes btnShine{to{background-position:250% center;}}
.btn-ico{font-size:22px;flex-shrink:0;}

/* Trust */
.trust-row{
  display:flex;justify-content:center;gap:20px;
  margin-top:12px;
}
.tr{
  font-size:9px;font-weight:700;letter-spacing:1.5px;
  color:rgba(255,255,255,0.2);text-transform:uppercase;
  display:flex;align-items:center;gap:4px;
}
.tr::before{content:'✓';color:var(--green);font-size:10px;}

/* Social proof */
.proof{
  display:flex;align-items:center;gap:10px;
  margin-top:14px;
  background:rgba(0,255,135,0.05);
  border:1px solid rgba(0,255,135,0.12);
  border-radius:10px;padding:11px 14px;
}
.proof-avs{display:flex;}
.pav{
  width:26px;height:26px;border-radius:50%;
  border:2px solid var(--dark);
  margin-left:-7px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;flex-shrink:0;
}
.pav:first-child{margin-left:0;}
.pa1{background:linear-gradient(135deg,#00C2FF,#0055AA);color:#fff;}
.pa2{background:linear-gradient(135deg,#00FF87,#00a855);color:#000;}
.pa3{background:linear-gradient(135deg,#FFB800,#FF8C00);color:#000;}
.pa4{background:linear-gradient(135deg,#FF3333,#CC0000);color:#fff;}
.pa5{background:rgba(255,255,255,0.08);color:var(--dim);font-size:9px;}
.proof-txt{font-size:10px;font-weight:600;color:rgba(255,255,255,0.45);}
.proof-txt b{color:var(--green);}

/* ═══════════ DIVIDER ═══════════ */
.divider{
  display:flex;align-items:center;gap:12px;
  padding:0 20px;margin-top:28px;
  opacity:0;animation:up 0.7s 0.65s ease forwards;
}
.d-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(0,194,255,0.2),transparent);}
.d-ico{font-size:18px;filter:drop-shadow(0 0 8px rgba(0,194,255,0.5));}

/* ═══════════ STATS ═══════════ */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:0 20px;margin-top:0;
  opacity:0;animation:up 0.7s 0.7s ease forwards;
}
.stat{
  background:var(--panel);
  border:1px solid rgba(255,255,255,0.05);
  border-radius:12px;padding:22px 8px 16px;
  text-align:center;position:relative;overflow:hidden;
  transition:transform 0.2s,border-color 0.2s;cursor:default;
}
.stat:hover{transform:translateY(-5px);}
.stat:nth-child(1):hover{border-color:rgba(0,194,255,0.3);}
.stat:nth-child(2):hover{border-color:rgba(0,255,135,0.3);}
.stat:nth-child(3):hover{border-color:rgba(255,184,0,0.3);}
.s-bar{position:absolute;top:0;left:15%;right:15%;height:2px;border-radius:2px;}
.sb1{background:linear-gradient(90deg,var(--sky2),var(--sky));}
.sb2{background:linear-gradient(90deg,var(--green2),var(--green));}
.sb3{background:linear-gradient(90deg,var(--amber),#FF8C00);}
.s-num{
  font-family:'Black Ops One',cursive;
  font-size:26px;letter-spacing:1px;line-height:1;
}
.sn1{color:var(--sky);}
.sn2{color:var(--green);}
.sn3{color:var(--amber);}
.s-lbl{font-size:8px;letter-spacing:2px;font-weight:700;color:var(--dim);text-transform:uppercase;margin-top:6px;}

/* ═══════════ FEATURE CARDS ═══════════ */
.feats{
  padding:0 20px;margin-top:10px;
  display:flex;flex-direction:column;gap:9px;
  opacity:0;animation:up 0.7s 0.8s ease forwards;
}
.feat{
  background:var(--panel2);
  border:1px solid rgba(255,255,255,0.05);
  border-left:3px solid;
  border-radius:10px;padding:16px 16px;
  display:flex;align-items:center;gap:14px;
  transition:transform 0.2s,background 0.2s;cursor:default;
}
.feat:hover{transform:translateX(5px);background:rgba(0,194,255,0.03);}
.feat:nth-child(1){border-left-color:var(--sky);}
.feat:nth-child(2){border-left-color:var(--green);}
.feat:nth-child(3){border-left-color:var(--amber);}
.feat:nth-child(4){border-left-color:var(--red);}
.feat-ico{font-size:26px;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(0,194,255,0.3));}
.feat-body{flex:1;}
.feat-title{
  font-family:'Rajdhani',sans-serif;
  font-size:16px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:#fff;
}
.feat-desc{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:0.3px;font-family:'Barlow',sans-serif;}
.feat-chip{
  font-size:10px;font-weight:700;letter-spacing:1px;
  color:var(--sky);background:rgba(0,194,255,0.1);
  border:1px solid rgba(0,194,255,0.2);
  border-radius:4px;padding:4px 10px;white-space:nowrap;flex-shrink:0;
  font-family:'Rajdhani',sans-serif;
}

/* ═══════════ CRICKET BADGE STRIP ═══════════ */
.sports-strip{
  margin:18px 20px 0;
  background:var(--panel);
  border:1px solid rgba(255,255,255,0.05);
  border-radius:10px;
  display:flex;
  overflow:hidden;
  opacity:0;animation:up 0.7s 0.9s ease forwards;
}
.sp-item{
  flex:1;text-align:center;padding:16px 6px;
  border-right:1px solid rgba(255,255,255,0.05);
  transition:background 0.2s;cursor:default;
}
.sp-item:last-child{border-right:none;}
.sp-item:hover{background:rgba(0,194,255,0.05);}
.sp-ico{font-size:22px;display:block;}
.sp-lbl{font-size:8px;letter-spacing:1.5px;font-weight:700;color:var(--dim);text-transform:uppercase;margin-top:4px;}

/* ═══════════ BOTTOM CTA ═══════════ */
.bottom-cta{
  padding:24px 20px 0;
  opacity:0;animation:up 0.7s 1.0s ease forwards;
}
.btm-head{
  font-family:'Black Ops One',cursive;
  font-size:clamp(20px,6vw,28px);
  letter-spacing:2px;text-align:center;line-height:1.2;color:#fff;
  margin-bottom:16px;
}
.btm-head span{
  background:linear-gradient(135deg,var(--sky),var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.btm-btn{
  position:relative;width:100%;
  padding:20px 20px;
  font-family:'Black Ops One',cursive;
  font-size:20px;letter-spacing:3px;
  color:#fff;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(105deg,#0055AA,#0099EE,#00C2FF,#0099EE,#0055AA);
  background-size:250% auto;
  animation:btnShine 3s linear infinite;
  transition:transform 0.15s;
  box-shadow:0 6px 40px rgba(0,150,220,0.45);
  display:flex;align-items:center;justify-content:center;gap:12px;
  overflow:hidden;
}
.btm-btn:hover{transform:translateY(-2px) scale(1.01);}
.btm-btn:active{transform:scale(0.98);}
.btm-btn::after{
  content:'';position:absolute;
  top:-50%;left:-80%;width:45%;height:200%;
  background:rgba(255,255,255,0.14);transform:skewX(-18deg);
  animation:swipe 3.5s 1.5s infinite;
}

/* ═══════════ TICKER ═══════════ */
.ticker-wrap{
  margin-top:28px;overflow:hidden;
  padding:10px 0;
  border-top:1px solid rgba(0,194,255,0.08);
  border-bottom:1px solid rgba(0,194,255,0.08);
  opacity:0;animation:up 0.7s 1.1s ease forwards;
}
.ticker{display:flex;width:max-content;animation:tickScroll 22s linear infinite;}
.t-item{
  font-family:'Rajdhani',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:4px;
  color:rgba(255,255,255,0.18);padding:0 24px;white-space:nowrap;text-transform:uppercase;
}
.t-hi{color:var(--sky);}
@keyframes tickScroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

.footer{
  text-align:center;margin-top:26px;
  font-size:8px;letter-spacing:2px;font-weight:600;
  color:rgba(255,255,255,0.07);text-transform:uppercase;
  opacity:0;animation:up 0.7s 1.15s ease forwards;
}

@keyframes up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:var(--sky2);border-radius:2px;}
</style>

<script>
function join(){
  fbq('track','Subscribe');
  setTimeout(function(){
    window.location.href="https://t.me/+UQbdfTVtETxkODM9";
  },400);

/* ── HOW TO SET LOGO ──
   Apna logo set karne ke liye:
   1. Apni photo kisi bhi free hosting pe upload karo:
      - postimages.org
      - imgbb.com
      - imgur.com
   2. Direct image link copy karo (jo .jpg/.png pe end ho)
